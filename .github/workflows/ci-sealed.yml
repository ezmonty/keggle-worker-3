          BOOTSTRAP_LOCK
          python3 -m pip install --require-hashes --quiet --disable-pip-version-check -r bootstrap.lock
          printf '%s' "$RUNNER_B64" | base64 -d > ci_sealed_runner.py
          unset RUNNER_B64
          nohup python3 ci_sealed_runner.py > runner.log 2>&1 &
          echo $! > runner.pid
          for i in $(seq 1 120); do
            test -s sealed_ci_pub.name && break
            kill -0 "$(cat runner.pid)" 2>/dev/null || break
            sleep 1
          done
          test -s sealed_ci_pub.name || { echo "[sealed-ci] runner announced no key"; exit 1; }
          echo "name=$(cat sealed_ci_pub.name)" >> "$GITHUB_OUTPUT"
      - name: announce the shard pub (a run artifact; GitHub's record binds it to this run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.start.outputs.name }}
          path: sealed_ci_pub.json
          if-no-files-found: error
          retention-days: 1
      - name: attest the opened content (before any payload code runs)
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          # The runner writes sealed_ci_content.txt right after it opens the source and then WAITS for sealed_ci_go,
          # so nothing from the payload has run when this prints. Bounded: it stops waiting when the runner exits (no
          # DEK) and at the job's own timeout. Only ONE line of the exact shape is published; source_sha is echoed
          # only as 40 hex (a dispatch input is untrusted text), else `none`. The go file is created whatever happens.
          pid="$(cat runner.pid)"
          for i in $(seq 1 2400); do
            test -s sealed_ci_content.txt && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') sha=none ;;
            *) if [ "${#SOURCE_SHA}" -eq 40 ]; then sha="$SOURCE_SHA"; else sha=none; fi ;;
          esac
          line="$(LC_ALL=C tr -cd '\n -~' < sealed_ci_content.txt 2>/dev/null | head -1 || true)"
          if printf '%s\n' "$line" | LC_ALL=C grep -Eq '^content_sha256=[0-9a-f]{64} job=(shard:(0|[1-9][0-9]{0,2})|role:[a-z0-9][a-z0-9-]{0,63}|refused)$'; then
            echo "::notice title=ci-sealed-content::${line} source_sha=${sha}"
          fi
          touch sealed_ci_go
      - name: wait for the sealed runner (DEK fetch, tests, sealed verdict)
        run: |
          pid="$(cat runner.pid)"
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          # printable ASCII only (a NUL ends the line for some greps, so `)$` matched and the bytes after it were
          # printed), then ONE line that is exactly a runner line, its numbers canonical and bounded (R1' N-f: ~12
          # bits per shard remain a same-uid child can choose; docs/sealed-ci-v2-protocol.md states the residual)
          LC_ALL=C tr -cd '\n -~' < runner.log | LC_ALL=C grep -E '^\[sealed-ci\] (pytest rc=-?(0|[1-9][0-9]{0,2}) passed=(True|False) \(result sealed to station\)|runner error \((sealed|unsealable)\)|no DEK delivered within budget \(nothing run, nothing sealed\))$' | tail -1 || true
          # a pytest shard's failing test IDs (ci-sealed-failures, P2): written after the payload ran, so only lines of
          # the exact shape are echoed (printable ASCII, no `%` inside an ID, canonical numbers), at most nine
          if [ -f sealed_ci_failures.txt ]; then
            LC_ALL=C tr -cd '\n -~' < sealed_ci_failures.txt | LC_ALL=C grep -E '^::notice title=ci-sealed-failures::(UNPARSED|n=(0|[1-9][0-9]{0,5}) sha256=[0-9a-f]{64} part=[1-9]/[1-9](%0A[!-$&-~][ -$&-~]{0,511})*)$' | head -9 || true
          fi
          rc="$(cat sealed_ci_rc 2>/dev/null || true)"
          case "$rc" in 0|1) ;; *) rc=1 ;; esac
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: sealed-ci-result-${{ matrix.shard }}   # per-shard artifact; the station downloads + merges all
          path: sealed_ci_result.json
          if-no-files-found: warn
