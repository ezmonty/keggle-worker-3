# ci-sealed — the PUBLIC-repo-safe sealed CI worker, v2 (station.ci_sealed + station.sealed_handshake runner side;
# protocol: docs/sealed-ci-v2-protocol.md).
#
# Nothing readable is saved in public git and NO KEY IS HELD: this repo has no seal secret. Each shard job mints its
# OWN X25519 pair in memory (the runner process, started in the background so the key outlives the announce step
# without ever touching disk or env), announces only the PUBLIC half as a run artifact (GitHub's record binds it to
# this run), then polls this repo's nonce-tagged release for its DEK — sealed by the station to that pub, bound to
# this run id and shard index. The source arrives as a DEK-SEALED ciphertext RELEASE ASSET (a public download URL,
# fetched with NO token), the selector arrives DEK-SEALED, the pytest verdict is SEALED back to the station's
# per-run pub before upload, and the log prints an aggregate pass/fail only. Same burn-sandbox hardening as
# sandbox-score-sealed:
#   permissions:{}  -> the GITHUB_TOKEN can do nothing (no repo write, no other workflow's secrets).
#   NO secrets.*    -> nothing to mask, steal or rotate; a shard key dies with its job.
#   NO actions/checkout -> the runner never fetches any repo's SOURCE via git; it curls the ciphertext asset,
#                          holds only the sealed inputs + the embedded runner + its own in-memory key.
#   source_url ALLOWLIST -> only https://github.com/<this repo>/releases/download/* is fetched, over https only,
#                          capped at 200 MB (adversarial review 2026-09-11: a dispatcher could otherwise point
#                          the runner at any host). The DEK URL is built by the runner from GITHUB_REPOSITORY.
#   ONE runner process  -> start step launches it (key minted inside), the announce step uploads only the pub, the
#                          wait step reads its exit code from sealed_ci_rc. VERIFIED LIVE on keggle-worker-3, run
#                          38339686962 (worklog phase1-canary.md): the background process outlives its step and
#                          holds the in-memory key across steps, an in-progress run lists its v4 artifacts, the DEK
#                          release asset is served in time, and the long pub artifact name is accepted.
#   STRICT PUBLIC LINE  -> the wait step echoes ONE line of runner.log, and only one that is EXACTLY one of the
#                          runner's own fixed lines (its whole text, anchored, printable ASCII, numbers bounded). Code under test runs as the same uid
#                          and can append to runner.log; a looser `^\[sealed-ci\] ` filter would publish whatever it
#                          wrote after the prefix (review R3 W9). tests/test_ci_sealed_workflow_shape.py pins it.
# Selector keys: see the canonical list in .github/scripts/ci_sealed_runner.py's docstring.
# The runner is EMBEDDED as a base64 blob (RUNNER_B64) that decodes to .github/scripts/ci_sealed_runner.py
# byte-for-byte (tests/test_ci_sealed_runner_interop.py asserts it) — so the crypto on this public box is
# exactly the reviewed+interop-tested code, and can never silently drift.
name: ci-sealed
run-name: ci-sealed-${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: public https URL of the DEK-sealed source tarball (ciphertext release asset)
        required: true
      sealed_selector:
        description: base64 DEK-sealed selector (v2 envelope; keys per ci_sealed_runner.py's docstring; opens only with the DEK a shard receives after announcing its pub)
        required: true
      station_seal_pub:
        description: base64 station seal PUB (the result is sealed back to this)
        required: true
      nonce:
        description: correlation id (names the run, the release tag and the pub artifact; bound into every v2 AAD)
        required: true
      shards:
        description: 'JSON list of shard indices for the matrix (expandable concurrency); default "[0]" = one job, whole suite'
        required: false
        default: '[0]'
      shard_count:
        description: 'total shard count; each job runs paths[SHARD_INDEX::SHARD_COUNT]. default "1"'
        required: false
        default: '1'
      python_version:
        description: "optional actions/setup-python version (e.g. '3.11'); default '' = the image's system python3 (no setup step runs)"
        required: false
        default: ''
permissions: {}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40          # >= the runner's ONE shared _RUN_WALL (2000 s) + 5 min setup/seal/upload; the sealed TIMEOUT red stays reachable
    strategy:
      fail-fast: false          # one shard failing must NOT cancel the siblings — each shard is independent
      max-parallel: 40          # the Pro account's concurrent-job ceiling; one dispatch fans to this many jobs
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    # The REAL substrate: valor looks directly at the physics via Postgres (pgvector for embeddings/RAG). Without
    # this a DB-touching test silently falls back to SQLite and false-greens. The container is ephemeral on the
    # runner (nothing leaves); the runner only USES it when the sealed selector sets DATABASE_URL + migrations.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: valor
          POSTGRES_PASSWORD: valor
          POSTGRES_DB: valor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valor" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      # Optional interpreter pin (sealed-ci-channel-spec §2.2 item 2 / §5 K2): a dispatcher that must match its
      # sovereign runner's Python (valor = 3.11) passes `python_version`; the default '' SKIPS this step entirely so
      # every existing caller keeps the image's system python3 unchanged. setup-python needs NO checkout (no `cache:`)
      # and NO token scope. Limitation (spec §7 NOT FOUND): whether the requested version resolves from the
      # ubuntu-24.04 toolcache without a download has not been observed live. tests/test_ci_sealed_workflow_shape.py
      # asserts the step is conditional on this input and precedes the runner step.
      - uses: actions/setup-python@v5
        if: inputs.python_version != ''
        with:
          python-version: ${{ inputs.python_version }}
      - name: fetch sealed source (public ciphertext asset — no token, no checkout)
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          # ALLOWLIST: only a release asset of THIS repo, https only, bounded size. Anything else is refused
          # before curl runs (the URL is a dispatch input — treat it as untrusted).
          case "$SOURCE_URL" in
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/"*) ;;
            *) echo "refused: source_url is not a release asset of ${GITHUB_REPOSITORY}"; exit 1 ;;
          esac
          for i in $(seq 1 10); do
            curl --proto '=https' --max-filesize 200000000 -fsSL "$SOURCE_URL" -o src.sealed && break
            echo "fetch attempt $i failed (asset may still be replicating); retrying"; sleep 8
          done
          test -s src.sealed
      - name: start the sealed runner (mints this shard's key in memory; only the PUBLIC half leaves the process)
        id: start
        env:
          SEALED_SOURCE_PATH: src.sealed
          SEALED_SELECTOR_B64: ${{ inputs.sealed_selector }}
          STATION_SEAL_PUB_B64: ${{ inputs.station_seal_pub }}
          SEALED_NONCE: ${{ inputs.nonce }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          RUNNER_B64: ""
        run: |
          # cryptography = the sealbox crypto; pytest = the CI harness (always needed, even when a sealed
          # tree ships no requirements.txt). The tree's own deps come from its requirements.txt via install_reqs.
          python3 -m pip install --quiet --disable-pip-version-check cryptography pytest
          printf '%s' "$RUNNER_B64" | base64 -d > ci_sealed_runner.py
          unset RUNNER_B64
          nohup python3 ci_sealed_runner.py > runner.log 2>&1 &
          echo $! > runner.pid
          for i in $(seq 1 120); do
            test -s sealed_ci_pub.name && break
            kill -0 "$(cat runner.pid)" 2>/dev/null || break
            sleep 1
          done
          test -s sealed_ci_pub.name || { echo "[sealed-ci] runner announced no key"; exit 1; }
          echo "name=$(cat sealed_ci_pub.name)" >> "$GITHUB_OUTPUT"
      - name: announce the shard pub (a run artifact; GitHub's record binds it to this run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.start.outputs.name }}
          path: sealed_ci_pub.json
          if-no-files-found: error
          retention-days: 1
      - name: wait for the sealed runner (DEK fetch, tests, sealed verdict)
        run: |
          pid="$(cat runner.pid)"
          while kill -0 "$pid" 2>/dev/null; do sleep 5; done
          # printable ASCII only (a NUL ends the line for some greps, so `)$` matched and the bytes after it were
          # printed), then ONE line that is exactly a runner line, its numbers canonical and bounded (R1' N-f: ~12
          # bits per shard remain a same-uid child can choose; docs/sealed-ci-v2-protocol.md states the residual)
          LC_ALL=C tr -cd '\n -~' < runner.log | LC_ALL=C grep -E '^\[sealed-ci\] (pytest rc=-?(0|[1-9][0-9]{0,2}) passed=(True|False) \(result sealed to station\)|runner error \((sealed|unsealable)\)|no DEK delivered within budget \(nothing run, nothing sealed\))$' | tail -1 || true
          rc="$(cat sealed_ci_rc 2>/dev/null || true)"
          case "$rc" in 0|1) ;; *) rc=1 ;; esac
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-ci-result-${{ matrix.shard }}   # per-shard artifact; the station downloads + merges all
          path: sealed_ci_result.json
          if-no-files-found: warn
