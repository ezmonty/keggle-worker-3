# ci-sealed — the PUBLIC-repo-safe sealed CI worker (station.ci_sealed runner side).
#
# Nothing readable is saved in public git: the source arrives as an X25519-SEALED ciphertext RELEASE ASSET
# (a public download URL, fetched with NO token), the selector arrives SEALED, only this repo's masked
# RUNNER_SEAL_PRIV_B64 secret opens either, the pytest verdict is SEALED back to the station's pub before
# upload, and the log prints an aggregate pass/fail only. Same burn-sandbox hardening as sandbox-score-sealed:
#   permissions:{}  -> the GITHUB_TOKEN can do nothing (no repo write, no other workflow's secrets).
#   NO actions/checkout -> the runner never fetches any repo's SOURCE via git; it curls the ciphertext asset,
#                          holds only the sealed inputs + the embedded runner + a masked seal key.
# The runner is EMBEDDED as a base64 blob (RUNNER_B64) that decodes to .github/scripts/ci_sealed_runner.py
# byte-for-byte (tests/test_ci_sealed_runner_interop.py asserts it) — so the crypto on this public box is
# exactly the reviewed+interop-tested code, and can never silently drift.
name: ci-sealed
run-name: ci-sealed-${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: public https URL of the X25519-sealed source tarball (ciphertext release asset)
        required: true
      sealed_selector:
        description: base64 X25519-sealed {paths, pytest_args, install_reqs} (only RUNNER_SEAL_PRIV opens it)
        required: true
      station_seal_pub:
        description: base64 station seal PUB (the result is sealed back to this)
        required: true
      nonce:
        description: correlation id (uniquely names the run so a concurrent dispatch finds its own)
        required: true
      shards:
        description: 'JSON list of shard indices for the matrix (expandable concurrency); default "[0]" = one job, whole suite'
        required: false
        default: '[0]'
      shard_count:
        description: 'total shard count; each job runs paths[SHARD_INDEX::SHARD_COUNT]. default "1"'
        required: false
        default: '1'
permissions: {}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false          # one shard failing must NOT cancel the siblings — each shard is independent
      max-parallel: 40          # the Pro account's concurrent-job ceiling; one dispatch fans to this many jobs
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    # The REAL substrate: valor looks directly at the physics via Postgres (pgvector for embeddings/RAG). Without
    # this a DB-touching test silently falls back to SQLite and false-greens. The container is ephemeral on the
    # runner (nothing leaves); the runner only USES it when the sealed selector sets DATABASE_URL + migrations.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: valor
          POSTGRES_PASSWORD: valor
          POSTGRES_DB: valor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valor" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: fetch sealed source (public ciphertext asset — no token, no checkout)
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          for i in $(seq 1 10); do
            curl -fsSL "$SOURCE_URL" -o src.sealed && break
            echo "fetch attempt $i failed (asset may still be replicating); retrying"; sleep 8
          done
          test -s src.sealed
      - name: run the sealed CI
        env:
          SEALED_SOURCE_PATH: src.sealed
          SEALED_SELECTOR_B64: ${{ inputs.sealed_selector }}
          STATION_SEAL_PUB_B64: ${{ inputs.station_seal_pub }}
          RUNNER_SEAL_PRIV_B64: ${{ secrets.RUNNER_SEAL_PRIV_B64 }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          RUNNER_B64: ""
        run: |
          # cryptography = the sealbox crypto; pytest = the CI harness (always needed, even when a sealed
          # tree ships no requirements.txt). The tree's own deps come from its requirements.txt via install_reqs.
          python3 -m pip install --quiet --disable-pip-version-check cryptography pytest
          printf '%s' "$RUNNER_B64" | base64 -d > ci_sealed_runner.py
          python3 ci_sealed_runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sealed-ci-result-${{ matrix.shard }}   # per-shard artifact; the station downloads + merges all
          path: sealed_ci_result.json
          if-no-files-found: warn
