          pycparser==3.11 ; implementation_name != 'PyPy' and platform_python_implementation != 'PyPy' \
              --hash=sha256:51d5a8ba2be0bbe440b99d2112604c95bbbc3c2748a64260186c541e1729cd80 \
              --hash=sha256:d875f09c3507d00e1aba0eecc6dcadc1352f30fff09dc6bff2f1c2935e97c2bc
          typing-extensions==4.16.0 ; python_full_version < '3.11' \
              --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8 \
              --hash=sha256:dc983d19a509c94dba722ee6abd33940f7c05a89e243c47e907eb4db6f1a43e5
          BOOTSTRAP_LOCK
          python3 -m pip install --require-hashes --quiet --disable-pip-version-check -r bootstrap.lock
          printf '%s' "$RUNNER_B64" | base64 -d > sealed_runner.py
          unset RUNNER_B64
          nohup python3 sealed_runner.py > runner.log 2>&1 &
          echo $! > runner.pid
          for i in $(seq 1 120); do
            test -s sealed_score_pub.name && break
            kill -0 "$(cat runner.pid)" 2>/dev/null || break
            sleep 1
          done
          test -s sealed_score_pub.name || { echo "[sealed-runner] runner announced no key"; exit 1; }
          echo "name=$(cat sealed_score_pub.name)" >> "$GITHUB_OUTPUT"
      - name: announce the shard pub (a run artifact; GitHub's record binds it to this run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.start.outputs.name }}
          path: sealed_score_pub.json
          if-no-files-found: error
          retention-days: 1
      - name: wait for the sealed runner (DEK fetch, jobs, sealed scores)
        run: |
          pid="$(cat runner.pid)"
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          # printable ASCII only, then ONE line that is exactly a runner line, its numbers canonical and bounded (R3 W9;
          # R1' N-f: ~40 bits per shard remain; docs/sealed-ci-v2-protocol.md states the residual)
          LC_ALL=C tr -cd '\n -~' < runner.log | LC_ALL=C grep -E '^\[sealed-runner\] (shard (0|[1-9][0-9]{0,2})/[1-9][0-9]{0,2} ran (0|[1-9][0-9]{0,5}) jobs \(results sealed to station\)|runner error \(nothing sealed\)|no DEK delivered within budget \(nothing run, nothing sealed\))$' | tail -1 || true
          rc="$(cat sealed_score_rc 2>/dev/null || true)"
          case "$rc" in 0|1) ;; *) rc=1 ;; esac
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: sealed-scores-${{ matrix.shard }}   # per-shard artifact; the station downloads + merges all
          path: sealed_results.json
          if-no-files-found: warn
