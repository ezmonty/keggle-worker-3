# sandbox-score-sealed — the PUBLIC-repo-safe burn-sandbox (station.sealed_score runner side).
#
# Nothing readable is saved in public git: the batch arrives as X25519 SEALED ciphertext (only this repo's
# masked RUNNER_SEAL_PRIV_B64 secret opens it), the scores are SEALED back to the station's pub before upload,
# and the log prints aggregate counts only. Same burn-sandbox hardening as sandbox-score.yml:
#   permissions:{}  -> the GITHUB_TOKEN can do nothing (no repo write, no other workflow's secrets).
#   NO actions/checkout -> the runner never fetches keggle's source; it holds only the sealed inputs + the
#                          embedded runner + a masked seal key.
# The runner is EMBEDDED as a base64 blob (RUNNER_B64) that decodes to .github/scripts/sealed_runner.py
# byte-for-byte (tests/test_sealed_runner_interop.py asserts it) — so the crypto on this public box is exactly
# the reviewed+interop-tested code, and can never silently drift.
name: sandbox-score-sealed
run-name: sandbox-score-sealed-${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      sealed_batch:
        description: base64 X25519-sealed [{id, program}] batch (only RUNNER_SEAL_PRIV opens it)
        required: true
      station_seal_pub:
        description: base64 station seal PUB (results are sealed back to this)
        required: true
      nonce:
        description: correlation id (uniquely names the run so a concurrent dispatch finds its own)
        required: true
      shards:
        description: 'JSON list of shard indices for the matrix (expandable concurrency); default "[0]" = one job, whole batch'
        required: false
        default: '[0]'
      shard_count:
        description: 'total shard count; each job runs items[SHARD_INDEX::SHARD_COUNT]. default "1"'
        required: false
        default: '1'
permissions: {}
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false          # one shard failing must NOT cancel the siblings — each shard is independent
      max-parallel: 40          # cap at ~a Pro account's concurrent-job ceiling (the account cap is the bound)
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - name: run the sealed burn-sandbox
        env:
          SEALED_BATCH_B64: ${{ inputs.sealed_batch }}
          STATION_SEAL_PUB_B64: ${{ inputs.station_seal_pub }}
          RUNNER_SEAL_PRIV_B64: ${{ secrets.RUNNER_SEAL_PRIV_B64 }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          RUNNER_B64: ""
        run: |
          python3 -m pip install --quiet --disable-pip-version-check cryptography
          printf '%s' "$RUNNER_B64" | base64 -d > sealed_runner.py
          python3 sealed_runner.py
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-scores-${{ matrix.shard }}   # per-shard artifact; the station downloads + merges all
          path: sealed_results.json
