# sandbox-score-sealed — the PUBLIC-repo-safe burn-sandbox, v2 (station.sealed_score + station.sealed_handshake
# runner side; protocol: docs/sealed-ci-v2-protocol.md). GENERATED: edit .github/scripts/sandbox-score-sealed.template.yml
# and rebuild with .github/scripts/build_ci_sealed_workflow.py (tests/test_ci_sealed_workflow_shape.py enforces it).
#
# Nothing readable is saved in public git and NO KEY IS HELD: this repo has no seal secret. Each shard job mints its
# OWN X25519 pair in memory (the runner, started in the background), announces only the PUBLIC half as a run
# artifact (GitHub's record binds it to this run), and polls this repo's nonce-tagged release for its DEK. The batch
# arrives DEK-SEALED, the scores are SEALED back to the station's per-run pub before upload, and the log prints
# aggregate counts only. Same burn-sandbox hardening as sandbox-score.yml:
#   permissions:{}  -> the GITHUB_TOKEN can do nothing (no repo write, no other workflow's secrets).
#   NO secrets.*    -> nothing to mask, steal or rotate.
#   NO actions/checkout -> the runner never fetches keggle's source; it holds only the sealed inputs + the
#                          embedded runner + its own in-memory key.
#   PINNED BY HASH AND SHA -> the runner holds this shard's key and the DEK in memory: its bootstrap (cryptography)
#                          installs only the wheels in the start step's universal lock, --require-hashes, and every
#                          `uses:` is a 40-hex commit SHA (tests/test_ci_sealed_workflow_shape.py).
#   STRICT PUBLIC LINE  -> the wait step echoes ONE line of runner.log, and only one that is EXACTLY one of the
#                          runner's own fixed lines; a job (pyeval runs station-shipped code) can append to
#                          runner.log, and a prefix filter would publish what it wrote (review R3 W9).
# The runner is EMBEDDED as a base64 blob (RUNNER_B64) that decodes to .github/scripts/sealed_runner.py
# byte-for-byte (tests/test_sealed_runner_interop.py asserts it) — so the crypto on this public box is exactly
# the reviewed+interop-tested code, and can never silently drift.
name: sandbox-score-sealed
run-name: sandbox-score-sealed-${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      sealed_batch:
        description: base64 DEK-sealed [{id, kind, ...}] batch (v2 envelope; opens only with the DEK a shard receives after announcing its pub)
        required: true
      station_seal_pub:
        description: base64 station seal PUB (results are sealed back to this)
        required: true
      nonce:
        description: correlation id (names the run, the release tag and the pub artifact; bound with the run attempt into every v2.1 AAD)
        required: true
      shards:
        description: 'JSON list of shard indices for the matrix (expandable concurrency); default "[0]" = one job, whole batch'
        required: false
        default: '[0]'
      shard_count:
        description: 'total shard count; each job runs items[SHARD_INDEX::SHARD_COUNT]. default "1"'
        required: false
        default: '1'
permissions: {}
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false          # one shard failing must NOT cancel the siblings — each shard is independent
      max-parallel: 40          # cap at ~a Pro account's concurrent-job ceiling (the account cap is the bound)
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - name: start the sealed runner (mints this shard's key in memory; only the PUBLIC half leaves the process)
        id: start
        env:
          SEALED_BATCH_B64: ${{ inputs.sealed_batch }}
          STATION_SEAL_PUB_B64: ${{ inputs.station_seal_pub }}
          SEALED_NONCE: ${{ inputs.nonce }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ inputs.shard_count }}
          RUNNER_B64: ""
        run: |
          # HASH-PINNED: only these exact wheels install (--require-hashes), from one universal lock (pip evaluates
          # the markers). Regenerate, then rebuild this workflow, with:
          #   printf 'cryptography\n' | uv pip compile - --universal --python-version 3.10 \
          #     --generate-hashes --no-header --no-annotate
          cat > bootstrap.lock <<'BOOTSTRAP_LOCK'
          cffi==2.1.1 ; platform_python_implementation != 'PyPy' \
